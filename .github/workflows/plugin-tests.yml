name: plugin-tests
on:
  push:
    paths: ["plugins/**", ".github/workflows/plugin-tests.yml"]
  pull_request:
    paths: ["plugins/**"]
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ios-app-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt pyyaml
      - run: python -m pytest -q
